<!doctype html>
<html lang="en" class="ao-cloud-hydrating ao-admin-images-pending">
<head>
<script id="ao-role-fast-cache-bootstrap">
(()=>{
 const cacheKey=id=>'ao_role_cache_v1_'+String(id||'');
 const readCachedRole=id=>{try{const r=localStorage.getItem(cacheKey(id));return ['customer','seller','admin'].includes(r)?r:''}catch(_){return ''}};
 const apply=(id)=>{const role=readCachedRole(id);const root=document.documentElement;root.dataset.aoRoleFast=role||'unknown';root.dataset.aoRoleFastUser=String(id||'');};
 try{
  let userId='',hasAuthToken=false;
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.endsWith('-auth-token'))continue;hasAuthToken=true;try{const v=JSON.parse(localStorage.getItem(k)||'null');const u=v?.user||v?.currentSession?.user||v?.session?.user;if(u?.id){userId=String(u.id);break}}catch(_){}}
  apply(userId);
  // Public visitors are customer-level by default, so the shopping icons render on first paint.
  // If an auth token exists but its user cannot be read yet, keep the safe unknown state until verified.
  if(!hasAuthToken&&!userId){document.documentElement.dataset.aoRoleFast='customer';document.documentElement.dataset.aoRoleFastUser='';}
 }catch(_){apply('')}
 window.addEventListener('ao:auth-change',e=>{const id=String(e?.detail?.user?.id||'');apply(id)});
 window.addEventListener('ao:role-reset',()=>apply(''));
 window.__aoSetRoleFastCache=(id,role)=>{try{if(id&&['customer','seller','admin'].includes(role))localStorage.setItem(cacheKey(id),role)}catch(_){}apply(id)};
})();
</script>
